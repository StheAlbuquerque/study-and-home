
name: Pipeline de Segurança

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Analisar código com Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan --config p/default --error /src

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Iniciar aplicação
        run: |
          python3 -m http.server 8080 --bind 0.0.0.0 \
            > /tmp/study-home-server.log 2>&1 &

          curl --retry 10 --retry-connrefused \
            --retry-delay 2 \
            http://127.0.0.1:8080/
            
      - name: Analisar aplicação com OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080"
          fail_action: true
          allow_issue_writing: false